<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodBridge - Food Donation Coordination Platform</title>
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Firebase SDK (Simple CDN version) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <a href="index.html" class="logo">🍲 FoodBridge</a>
    <span style="font-size: 13px; color: #64748b;">CSE326 Project</span>
  </header>

  <main class="container">
    <!-- Welcome & Sign-In Card -->
    <div class="card" style="text-align: center; margin-top: 40px;">
      <h2>Coordinate & Donate Surplus Food</h2>
      <p style="color: #64748b; margin-bottom: 24px; font-size: 14px;">
        Connecting food donors, student volunteers, and shelters to make sure no good meal is wasted.
      </p>

      <!-- Google Login Button -->
      <div id="login-section">
        <button id="google-login-btn" class="btn btn-google">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <!-- Quick Profile Setup (Shown after Google Login if info is needed) -->
      <div id="profile-section" style="display: none; text-align: left; margin-top: 15px;">
        <h3>Complete Your Profile</h3>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 12px;">
          This contact number will be visible to volunteers picking up your donations.
        </p>
        <div class="form-group">
          <label>Your Phone / WhatsApp Number (10 digits):</label>
          <input type="tel" id="user-phone" maxlength="10" placeholder="e.g. 9876543210" required>
        </div>
        <div class="form-group">
          <label>I want to join as:</label>
          <select id="user-role">
            <option value="Donor">Food Donor (Restaurant / Mess / Household)</option>
            <option value="Volunteer">Volunteer (Pickup & Delivery)</option>
            <option value="Recipient">Shelter / NGO (Food Recipient)</option>
          </select>
        </div>
        <button id="save-profile-btn" class="btn btn-primary" style="width: 100%;">
          Go to Food Board →
        </button>
      </div>

    </div>

    <!-- Simple Project Footer -->
    <footer style="text-align: center; font-size: 12px; color: #94a3b8; margin-top: 30px;">
      <p>LPU CSE326 Web Development CA Project</p>
    </footer>
  </main>

  <!-- Configuration and Logic Scripts -->
  <script src="firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
